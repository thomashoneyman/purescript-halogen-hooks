name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Cache PureScript dependencies
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-spago-${{ hashFiles('package-lock.json', 'spago.lock', '**/spago.yaml', '.node-version') }}
          path: |
            .spago
            ~/.cache/spago-nodejs

      - name: Install test dependencies
        run: npm ci

      - name: Build source
        run: npm run build

      - name: Build examples
        run: npm run build:examples

      - name: Build tests
        run: npm run build:test

      - name: Run tests
        run: npm run test

      - name: Bundle examples
        run: npm run bundle:examples

      - name: Build performance bundle
        run: npm run bundle:performance
