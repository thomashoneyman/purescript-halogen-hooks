name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Cache PureScript dependencies
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-spago-1.0.4-purs-0.15.4-${{ hashFiles('spago.lock', '**/spago.yaml') }}
          path: |
            .spago
            ~/.cache/spago-nodejs

      - name: Install test dependencies
        run: npm ci

      - name: Build source
        run: npm run build

      - name: Build examples
        run: npm run build:examples

      - name: Build tests
        run: npm run build:test

      - name: Run tests
        run: npm run test

      - name: Bundle examples
        run: npm run bundle:examples

      - name: Build performance bundle
        run: npm run bundle:performance
